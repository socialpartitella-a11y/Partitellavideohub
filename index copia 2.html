<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partitella TV - Archivio Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen flex flex-col">
    <header class="w-full p-0">
        <img src="partitella live.png" alt="Partitella Live" class="w-full h-auto object-cover max-h-48">
    </header>
    
    <main class="max-w-6xl mx-auto p-4 flex-grow w-full">
        <!-- Tasto Ricarica Accattivante e Centrato -->
        <div class="my-6 flex justify-center">
            <button onclick="location.reload();" class="bg-gradient-to-r from-green-600 to-emerald-500 hover:from-green-500 hover:to-emerald-400 text-black font-bold text-sm px-6 py-3 rounded-full transition-all transform hover:scale-105 shadow-lg flex items-center gap-2 cursor-pointer">
                🔄 AGGIORNA ARCHIVIO
            </button>
        </div>

        <!-- Box incorporato di Google Drive in modalità Lista -->
        <div class="w-full h-[700px] rounded-xl overflow-hidden shadow-2xl border border-gray-800">
            <iframe src="https://drive.google.com/embeddedfolderview?id=1T5D0PWCoP_0adphvPgZUMLuFkkQPDcuO#list" class="w-full h-full border-0" allowfullscreen></iframe>
        </div>
    </main>

    <footer class="p-4 text-center text-xs text-gray-600 mt-8">
        Partitella Hub — Powered by Sbrus
    </footer>
</body>
</html>
