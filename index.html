<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Partitella TV - Archivio Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .smooth-scroll {
            -webkit-overflow-scrolling: touch;
        }
        /* Gestione area sicura inferiore iPhone (Home Bar) */
        .safe-bottom {
            padding-bottom: calc(1rem + env(safe-area-inset-bottom, 20px));
        }
        .safe-top {
            padding-top: calc(0.75rem + env(safe-area-inset-top, 0px));
        }
    </style>
</head>
<body class="bg-[#0b0c10] text-gray-100 min-h-screen flex flex-col font-sans selection:bg-orange-500 selection:text-white">

    <!-- Header con Logo Partitella Live -->
    <header class="w-full bg-[#121318] border-b border-gray-800/80 py-3 px-4 flex flex-col items-center justify-center sticky top-0 z-30 shadow-md">
        <img src="partitella live.png" alt="Partitella Live" class="h-14 sm:h-16 w-auto object-contain drop-shadow">
    </header>

    <main class="max-w-3xl mx-auto px-4 py-5 flex-grow w-full">

        <!-- Barra di controllo: Ricerca + Refresh -->
        <div class="space-y-3 mb-6">
            <div class="relative">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="🔍 Cerca squadra o fase..." 
                    class="w-full bg-[#181a20] border border-gray-700/80 rounded-2xl py-3.5 pl-4 pr-10 text-white placeholder-gray-500 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 text-base"
                    oninput="filterVideos()"
                >
                <button 
                    id="clearSearch" 
                    onclick="clearSearchInput()" 
                    class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white p-1 text-sm cursor-pointer">
                    ✕
                </button>
            </div>

            <div class="flex items-center justify-between text-xs text-gray-400 px-1">
                <span id="videoCount">Caricamento partite...</span>
                <button 
                    id="btnRefresh"
                    onclick="fetchVideos()" 
                    class="bg-gradient-to-r from-emerald-600 to-green-500 hover:from-emerald-500 hover:to-green-400 active:scale-95 text-black font-black uppercase tracking-wider px-4 py-2 rounded-xl text-xs transition-all shadow-md flex items-center gap-1.5 cursor-pointer">
                    <span id="refreshIcon">🔄</span> AGGIORNA
                </button>
            </div>
        </div>

        <!-- Stato Caricamento / Errore -->
        <div id="loader" class="flex flex-col items-center justify-center py-16 text-gray-400 space-y-3">
            <div class="w-8 h-8 border-4 border-orange-500 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-sm">Recupero partite in tempo reale...</p>
        </div>

        <div id="errorMessage" class="hidden bg-red-950/50 border border-red-800 text-red-200 p-4 rounded-2xl text-center text-sm"></div>

        <!-- Lista Card Partite -->
        <div id="videosGrid" class="space-y-3"></div>

        <!-- Empty State -->
        <div id="noResults" class="hidden text-center py-16 text-gray-500 space-y-2">
            <p class="text-3xl">⚽</p>
            <p class="text-sm">Nessuna partita disponibile al momento.</p>
        </div>
    </main>

    <!-- Overlay Video Player Nativo Partitella -->
    <div id="playerOverlay" class="hidden fixed inset-0 z-50 bg-black flex flex-col justify-between">
        
        <!-- Barra Superiore con Titolo Centrato e X fissa a destra -->
        <div class="w-full bg-[#121318]/95 backdrop-blur border-b border-gray-800 px-4 py-3 safe-top flex items-center relative z-10">
            <div class="w-9 h-9 flex-shrink-0"></div>

            <div class="flex-grow text-center px-2 min-w-0">
                <span id="playerTitle" class="text-xs sm:text-sm font-bold text-gray-200 truncate block"></span>
            </div>

            <button 
                onclick="closePlayer()" 
                class="w-9 h-9 rounded-full bg-gray-800 hover:bg-gray-700 active:scale-90 flex items-center justify-center text-gray-200 font-bold text-base cursor-pointer border border-gray-700 flex-shrink-0">
                ✕
            </button>
        </div>

        <!-- Area Video Centrale con tag nativo -->
        <div class="flex-grow flex items-center justify-center p-2 sm:p-4 bg-black">
            <video 
                id="nativeVideo" 
                class="w-full max-h-[75vh] max-w-4xl rounded-xl object-contain bg-black shadow-2xl" 
                controls 
                playsinline 
                preload="metadata">
                Il tuo browser non supporta la riproduzione video.
            </video>
        </div>

        <!-- Barra Inferiore con Tasto Scarica Diretto -->
        <div class="w-full bg-[#121318]/95 border-t border-gray-800 px-4 pt-3 safe-bottom flex justify-center">
            <a 
                id="playerDownloadBtn" 
                href="#" 
                download
                class="w-full sm:w-auto max-w-xs bg-orange-500 hover:bg-orange-600 active:scale-95 text-black font-black text-xs py-3.5 px-6 rounded-xl transition flex items-center justify-center gap-2 text-center shadow-lg">
                ⬇ SCARICA QUESTA PARTITA
            </a>
        </div>
    </div>

    <footer class="py-4 text-center text-xs text-gray-600 border-t border-gray-900 bg-[#0d0e12]">
        Partitella Hub — Powered by Sbrus
    </footer>

    <script>
        // ENDPOINT PUBBLICO CLOUDFLARE R2 (Nessun token privato necessario nel frontend)
        const R2_PUBLIC_URL = 'https://pub-09ef3723da454cfba3c9f84e9b9c04f1.r2.dev';

        let allVideos = [];

        async function fetchVideos() {
            const loader = document.getElementById('loader');
            const grid = document.getElementById('videosGrid');
            const errorBox = document.getElementById('errorMessage');
            const refreshIcon = document.getElementById('refreshIcon');
            const countLabel = document.getElementById('videoCount');

            loader.classList.remove('hidden');
            refreshIcon.classList.add('inline-block', 'animate-spin');
            errorBox.classList.add('hidden');

            try {
                // Interroga il bucket pubblico R2 per ottenere l'elenco dei file
                const res = await fetch(R2_PUBLIC_URL);
                if (!res.ok) {
                    throw new Error(`Impossibile raggiungere il bucket (${res.status})`);
                }

                const xmlText = await res.text();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, "application/xml");

                const contents = xmlDoc.querySelectorAll("Contents");
                const items = [];

                contents.forEach(node => {
                    const key = node.querySelector("Key")?.textContent || "";
                    const lastModified = node.querySelector("LastModified")?.textContent || "";
                    const size = node.querySelector("Size")?.textContent || "0";

                    if (/\.(mp4|mov|mkv|webm)$/i.test(key)) {
                        items.push({
                            key,
                            lastModified: new Date(lastModified),
                            size: parseInt(size, 10)
                        });
                    }
                });

                // Ordina per data decrescente
                items.sort((a, b) => b.lastModified - a.lastModified);

                allVideos = items.map(item => parseVideoItem(item));
                renderVideos(allVideos);

            } catch (err) {
                console.error("Errore recupero video R2:", err);
                errorBox.textContent = `Errore di connessione a Cloudflare R2: ${err.message}`;
                errorBox.classList.remove('hidden');
                countLabel.textContent = "Errore di caricamento";
            } finally {
                loader.classList.add('hidden');
                refreshIcon.classList.remove('animate-spin');
            }
        }

        function parseVideoItem(item) {
            const rawFileName = item.key;
            const cleanName = rawFileName.replace(/\.[^/.]+$/, "");
            let teamA = "", teamB = "", matchLabel = "", phase = "Partita";

            if (cleanName.includes(" vs ")) {
                const parts = cleanName.split(" vs ");
                teamA = parts[0].trim().replace(/^"|"$/g, '');
                
                const rest = parts[1] || "";
                const subParts = rest.split(" - ");
                teamB = (subParts[0] || "").trim().replace(/^"|"$/g, '');
                matchLabel = (subParts[1] || "").trim();
                phase = (subParts[2] || "").trim() || "Campionato";
            } else {
                teamA = cleanName;
            }

            const directUrl = `${R2_PUBLIC_URL}/${encodeURIComponent(rawFileName)}`;

            return {
                rawName: cleanName,
                fileName: rawFileName,
                teamA,
                teamB,
                matchLabel,
                phase,
                createdTime: item.lastModified,
                url: directUrl
            };
        }

        function renderVideos(videos) {
            const grid = document.getElementById('videosGrid');
            const noResults = document.getElementById('noResults');
            const countLabel = document.getElementById('videoCount');

            grid.innerHTML = '';
            countLabel.textContent = `${videos.length} ${videos.length === 1 ? 'partita disponibile' : 'partite disponibili'}`;

            if (videos.length === 0) {
                noResults.classList.remove('hidden');
                return;
            }
            noResults.classList.add('hidden');

            videos.forEach(v => {
                const card = document.createElement('div');
                card.className = "bg-[#14161d] border border-gray-800/90 rounded-2xl p-4 shadow-lg hover:border-gray-700 transition flex flex-col justify-between gap-3";

                const isKnockout = /finale/i.test(v.phase);
                const badgeColor = isKnockout 
                    ? "bg-gradient-to-r from-orange-500 to-amber-500 text-black font-black" 
                    : "bg-gray-800 text-gray-300 font-semibold";

                card.innerHTML = `
                    <div class="flex items-center justify-between gap-2">
                        <span class="text-[10px] uppercase tracking-wider px-2.5 py-1 rounded-md ${badgeColor}">
                            ${v.phase || 'MATCH'} ${v.matchLabel ? '• ' + v.matchLabel : ''}
                        </span>
                    </div>

                    <div class="py-1">
                        ${v.teamB ? `
                            <div class="text-base sm:text-lg font-black tracking-tight text-white leading-tight">
                                <span>${v.teamA}</span>
                                <span class="text-orange-500 font-extrabold mx-1.5 text-sm">VS</span>
                                <span>${v.teamB}</span>
                            </div>
                        ` : `
                            <div class="text-base font-bold text-white truncate">${v.rawName}</div>
                        `}
                    </div>

                    <div class="grid grid-cols-2 gap-2 pt-1">
                        <button 
                            onclick="openPlayer('${v.url}', '${v.rawName.replace(/'/g, "\\'")}', '${v.fileName.replace(/'/g, "\\'")}')" 
                            class="w-full bg-orange-500 hover:bg-orange-600 active:scale-95 text-black font-black text-xs py-2.5 rounded-xl transition flex items-center justify-center gap-1.5 cursor-pointer">
                            ▶ GUARDA
                        </button>
                        <a 
                            href="${v.url}" 
                            download="${v.fileName}"
                            class="w-full bg-[#20232c] hover:bg-gray-700 active:scale-95 text-gray-200 font-bold text-xs py-2.5 rounded-xl transition flex items-center justify-center gap-1.5 text-center cursor-pointer">
                            ⬇ SCARICA
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterVideos() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const clearBtn = document.getElementById('clearSearch');

            clearBtn.classList.toggle('hidden', query === '');

            const filtered = allVideos.filter(v => {
                return v.rawName.toLowerCase().includes(query) ||
                       v.teamA.toLowerCase().includes(query) ||
                       v.teamB.toLowerCase().includes(query) ||
                       v.phase.toLowerCase().includes(query) ||
                       v.matchLabel.toLowerCase().includes(query);
            });

            renderVideos(filtered);
        }

        function clearSearchInput() {
            const input = document.getElementById('searchInput');
            input.value = '';
            filterVideos();
            input.focus();
        }

        function openPlayer(videoUrl, title, fileName) {
            const overlay = document.getElementById('playerOverlay');
            const video = document.getElementById('nativeVideo');
            const titleEl = document.getElementById('playerTitle');
            const downloadBtn = document.getElementById('playerDownloadBtn');

            titleEl.textContent = title;
            downloadBtn.href = videoUrl;
            downloadBtn.setAttribute('download', fileName);

            video.src = videoUrl;
            overlay.classList.remove('hidden');
            document.body.style.overflow = 'hidden';

            video.play().catch(e => console.log("Riproduzione interrotta o richiesta manuale"));
        }

        function closePlayer() {
            const overlay = document.getElementById('playerOverlay');
            const video = document.getElementById('nativeVideo');

            video.pause();
            video.removeAttribute('src');
            video.load();

            overlay.classList.add('hidden');
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closePlayer();
        });

        document.addEventListener('DOMContentLoaded', fetchVideos);
    </script>
</body>
</html>
