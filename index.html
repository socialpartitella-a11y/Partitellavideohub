<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Partitella TV - Archivio Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .smooth-scroll {
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head>
<body class="bg-[#0b0c10] text-gray-100 min-h-screen flex flex-col font-sans selection:bg-orange-500 selection:text-white">

    <!-- Header con Logo Partitella Live -->
    <header class="w-full bg-[#121318] border-b border-gray-800/80 py-3 px-4 flex flex-col items-center justify-center sticky top-0 z-30 shadow-md">
        <img src="partitella live.png" alt="Partitella Live" class="h-14 sm:h-16 w-auto object-contain drop-shadow">
    </header>

    <main class="max-w-3xl mx-auto px-4 py-5 flex-grow w-full">

        <!-- Barra di controllo: Ricerca + Refresh -->
        <div class="space-y-3 mb-6">
            <div class="relative">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="🔍 Cerca squadra o fase..." 
                    class="w-full bg-[#181a20] border border-gray-700/80 rounded-2xl py-3.5 pl-4 pr-10 text-white placeholder-gray-500 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 text-base"
                    oninput="filterVideos()"
                >
                <button 
                    id="clearSearch" 
                    onclick="clearSearchInput()" 
                    class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white p-1 text-sm cursor-pointer">
                    ✕
                </button>
            </div>

            <div class="flex items-center justify-between text-xs text-gray-400 px-1">
                <span id="videoCount">Caricamento partite...</span>
                <button 
                    id="btnRefresh"
                    onclick="fetchVideos()" 
                    class="bg-gradient-to-r from-emerald-600 to-green-500 hover:from-emerald-500 hover:to-green-400 active:scale-95 text-black font-black uppercase tracking-wider px-4 py-2 rounded-xl text-xs transition-all shadow-md flex items-center gap-1.5 cursor-pointer">
                    <span id="refreshIcon">🔄</span> AGGIORNA
                </button>
            </div>
        </div>

        <!-- Stato Caricamento / Errore -->
        <div id="loader" class="flex flex-col items-center justify-center py-16 text-gray-400 space-y-3">
            <div class="w-8 h-8 border-4 border-orange-500 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-sm">Recupero partite in tempo reale...</p>
        </div>

        <div id="errorMessage" class="hidden bg-red-950/50 border border-red-800 text-red-200 p-4 rounded-2xl text-center text-sm"></div>

        <!-- Lista Card Partite -->
        <div id="videosGrid" class="space-y-3"></div>

        <!-- Empty State -->
        <div id="noResults" class="hidden text-center py-16 text-gray-500 space-y-2">
            <p class="text-3xl">⚽</p>
            <p class="text-sm">Nessuna partita trovata.</p>
        </div>
    </main>

    <!-- Modal Video Player Standard -->
    <div id="videoModal" class="hidden fixed inset-0 z-[9999] bg-black/95 flex flex-col items-center justify-center p-3 sm:p-6 backdrop-blur-md">
        
        <!-- Elemento invisibile per catturare fisicamente il focus fuori dall'iframe -->
        <button id="focusStealer" class="opacity-0 absolute -top-10 left-0 h-0 w-0 pointer-events-none" tabindex="-1"></button>

        <!-- Header del Modale -->
        <div class="w-full max-w-3xl flex justify-between items-center mb-3 px-1 relative z-[10000]">
            <span id="modalTitle" class="text-sm font-bold text-gray-200 truncate pr-4 drop-shadow"></span>
            
            <button 
                type="button" 
                id="btnCloseModal"
                class="bg-gray-800 hover:bg-gray-700 active:scale-90 text-white w-10 h-10 rounded-full flex items-center justify-center text-lg font-black border border-gray-600 shadow-xl cursor-pointer">
                ✕
            </button>
        </div>
        
        <!-- Box Video Nativo 16:9 senza ritagli -->
        <div class="w-full max-w-3xl aspect-video bg-black rounded-2xl overflow-hidden border border-gray-800 shadow-2xl relative">
            <iframe 
                id="modalIframe" 
                class="w-full h-full border-0 block" 
                allow="autoplay; fullscreen" 
                allowfullscreen>
            </iframe>
        </div>

        <!-- Tasto di Chiusura Inferiore -->
        <button 
            type="button" 
            id="btnBottomClose"
            class="mt-4 px-6 py-2.5 bg-gray-900 border border-gray-700 active:bg-gray-800 text-gray-300 rounded-xl text-xs font-bold tracking-wider uppercase cursor-pointer">
            Chiudi Anteprima
        </button>
    </div>

    <footer class="py-4 text-center text-xs text-gray-600 border-t border-gray-900 bg-[#0d0e12]">
        Partitella Hub — Powered by Sbrus
    </footer>

    <script>
        const API_KEY = 'AIzaSyAWqT48D2fiOxr3G7Cxlc1es4hR9sfHBZw';
        const FOLDER_ID = '1T5D0PWCoP_0adphvPgZUMLuFkkQPDcuO';

        let allVideos = [];

        async function fetchVideos() {
            const loader = document.getElementById('loader');
            const grid = document.getElementById('videosGrid');
            const errorBox = document.getElementById('errorMessage');
            const refreshIcon = document.getElementById('refreshIcon');
            const countLabel = document.getElementById('videoCount');

            loader.classList.remove('hidden');
            refreshIcon.classList.add('inline-block', 'animate-spin');
            errorBox.classList.add('hidden');

            const query = `'${FOLDER_ID}' in parents and trashed = false`;
            const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&orderBy=createdTime desc&fields=files(id,name,mimeType,createdTime,size)&key=${API_KEY}`;

            try {
                const res = await fetch(url);
                if (!res.ok) {
                    const errData = await res.json();
                    throw new Error(errData.error?.message || `Errore HTTP ${res.status}`);
                }
                const data = await res.json();
                
                const files = (data.files || []).filter(f => 
                    (f.mimeType && f.mimeType.startsWith('video/')) || 
                    /\.(mp4|mov|mkv|webm)$/i.test(f.name)
                );

                allVideos = files.map(file => parseVideoItem(file));
                renderVideos(allVideos);
            } catch (err) {
                console.error("Errore fetch Drive:", err);
                errorBox.textContent = `Impossibile caricare i video: ${err.message}`;
                errorBox.classList.remove('hidden');
                countLabel.textContent = "Errore di connessione";
            } finally {
                loader.classList.add('hidden');
                refreshIcon.classList.remove('animate-spin');
            }
        }

        function parseVideoItem(file) {
            const cleanName = file.name.replace(/\.[^/.]+$/, "");
            let teamA = "", teamB = "", matchLabel = "", phase = "Partita";

            if (cleanName.includes(" vs ")) {
                const parts = cleanName.split(" vs ");
                teamA = parts[0].trim().replace(/^"|"$/g, '');
                
                const rest = parts[1] || "";
                const subParts = rest.split(" - ");
                teamB = (subParts[0] || "").trim().replace(/^"|"$/g, '');
                matchLabel = (subParts[1] || "").trim();
                phase = (subParts[2] || "").trim() || "Campionato";
            } else {
                teamA = cleanName;
            }

            return {
                id: file.id,
                rawName: cleanName,
                teamA,
                teamB,
                matchLabel,
                phase,
                createdTime: file.createdTime,
                previewUrl: `https://drive.google.com/file/d/${file.id}/preview`,
                downloadUrl: `https://drive.google.com/uc?export=download&id=${file.id}`
            };
        }

        function renderVideos(videos) {
            const grid = document.getElementById('videosGrid');
            const noResults = document.getElementById('noResults');
            const countLabel = document.getElementById('videoCount');

            grid.innerHTML = '';
            countLabel.textContent = `${videos.length} ${videos.length === 1 ? 'partita disponibile' : 'partite disponibili'}`;

            if (videos.length === 0) {
                noResults.classList.remove('hidden');
                return;
            }
            noResults.classList.add('hidden');

            videos.forEach(v => {
                const card = document.createElement('div');
                card.className = "bg-[#14161d] border border-gray-800/90 rounded-2xl p-4 shadow-lg hover:border-gray-700 transition flex flex-col justify-between gap-3";

                const isKnockout = /finale/i.test(v.phase);
                const badgeColor = isKnockout 
                    ? "bg-gradient-to-r from-orange-500 to-amber-500 text-black font-black" 
                    : "bg-gray-800 text-gray-300 font-semibold";

                card.innerHTML = `
                    <div class="flex items-center justify-between gap-2">
                        <span class="text-[10px] uppercase tracking-wider px-2.5 py-1 rounded-md ${badgeColor}">
                            ${v.phase || 'MATCH'} ${v.matchLabel ? '• ' + v.matchLabel : ''}
                        </span>
                    </div>

                    <div class="py-1">
                        ${v.teamB ? `
                            <div class="text-base sm:text-lg font-black tracking-tight text-white leading-tight">
                                <span>${v.teamA}</span>
                                <span class="text-orange-500 font-extrabold mx-1.5 text-sm">VS</span>
                                <span>${v.teamB}</span>
                            </div>
                        ` : `
                            <div class="text-base font-bold text-white truncate">${v.rawName}</div>
                        `}
                    </div>

                    <div class="grid grid-cols-2 gap-2 pt-1">
                        <button 
                            onclick="openModal('${v.id}', '${v.rawName.replace(/'/g, "\\'")}')" 
                            class="w-full bg-orange-500 hover:bg-orange-600 active:scale-95 text-black font-black text-xs py-2.5 rounded-xl transition flex items-center justify-center gap-1.5 cursor-pointer">
                            ▶ GUARDA
                        </button>
                        <a 
                            href="${v.downloadUrl}" 
                            target="_blank" 
                            rel="noopener noreferrer"
                            class="w-full bg-[#20232c] hover:bg-gray-700 active:scale-95 text-gray-200 font-bold text-xs py-2.5 rounded-xl transition flex items-center justify-center gap-1.5 text-center">
                            ⬇ SCARICA
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterVideos() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const clearBtn = document.getElementById('clearSearch');

            clearBtn.classList.toggle('hidden', query === '');

            const filtered = allVideos.filter(v => {
                return v.rawName.toLowerCase().includes(query) ||
                       v.teamA.toLowerCase().includes(query) ||
                       v.teamB.toLowerCase().includes(query) ||
                       v.phase.toLowerCase().includes(query) ||
                       v.matchLabel.toLowerCase().includes(query);
            });

            renderVideos(filtered);
        }

        function clearSearchInput() {
            const input = document.getElementById('searchInput');
            input.value = '';
            filterVideos();
            input.focus();
        }

        function openModal(id, title) {
            const modal = document.getElementById('videoModal');
            const iframe = document.getElementById('modalIframe');
            const titleEl = document.getElementById('modalTitle');

            titleEl.textContent = title;
            // Parametro autoplay per avvio immediato
            iframe.src = `https://drive.google.com/file/d/${id}/preview?autoplay=1`;
            iframe.style.pointerEvents = 'auto';
            
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('videoModal');
            const iframe = document.getElementById('modalIframe');

            iframe.src = 'about:blank';
            modal.classList.add('hidden');
            document.body.style.overflow = '';
        }

        document.addEventListener('DOMContentLoaded', () => {
            const modal = document.getElementById('videoModal');
            const iframe = document.getElementById('modalIframe');
            const focusStealer = document.getElementById('focusStealer');

            document.getElementById('btnCloseModal').addEventListener('click', (e) => {
                e.stopPropagation();
                closeModal();
            });

            document.getElementById('btnBottomClose').addEventListener('click', (e) => {
                e.stopPropagation();
                closeModal();
            });

            // Click/Tap sullo sfondo nero:
            // 1. Sposta forzatamente il focus attivo del browser fuori dall'iframe
            // 2. Disabilita temporaneamente pointer-events sull'iframe per 150ms
            // Questo fa perdere a Drive qualsiasi interazione touch/hover, dissolvendo i controlli opachi
            modal.addEventListener('pointerdown', (e) => {
                if (e.target === modal) {
                    focusStealer.focus();
                    iframe.style.pointerEvents = 'none';
                    setTimeout(() => {
                        iframe.style.pointerEvents = 'auto';
                    }, 150);
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeModal();
            });

            fetchVideos();
        });
    </script>
</body>
</html>
